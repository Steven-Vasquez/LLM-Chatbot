<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Chatbot</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

    <div class="chat-layout">
        <div id="sidebar">
            <h3>Chats</h3>
            <div id="chat-list"></div>
            <button id="new-chat-btn">+ New Chat</button>
        </div>

        <div class="chat-container">
            <h2>Chat</h2>
            <div id="chat-box"></div>

            <form id="chat-form">
                <input type="text" id="message" placeholder="Type a message..." required autocomplete="off">
                <button type="submit">Send</button>
            </form>

            <div class="chat-controls">

                <div class="mode-row">
                    <span class="mode-label">Mode:</span>
                    <div class="mode-switch">
                        <div class="mode-option active" data-mode="basic">Basic</div>
                        <div class="mode-option" data-mode="agent">Agent</div>
                    </div>
                </div>

                <div class="tool-row">
                    <div class="tool-chip" data-tool="database_tool">
                        <span class="icon">🗄️</span>
                        <span>Database</span>
                    </div>

                    <div class="tool-chip" data-tool="web_search_tool">
                        <span class="icon">🌐</span>
                        <span>Web Search</span>
                    </div>
                </div>

            </div>


        </div>

        <div class="debug-output">
            <div class="debug-header-row">
                <h3>Debug Output</h3>
                <button id="clear-debug-btn" class="dark-btn">Clear Debug</button>
            </div>
            <div id="debug-content">
                <!-- Debug messages will appear here as: <div class="debug-line">DEBUG MESSAGE</div> -->
            </div>
        </div>
    </div>

    <script type="module" src="/QA_Chatbot/js/chat.js"></script>

</body>

</html>
